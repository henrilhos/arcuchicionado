<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ar Cuchicionado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container p-3">
      <header class="row-fluid">
        <h1 class="text-center">Ar Cuchicionado</h1>
      </header>

      <div class="row-fluid">
        <center>
          <audio id="audio" loop="true">
            <source
              src="sounds/cuchicionado.mp3"
              type="audio/mpeg"
              codecs="vorbis"
            />
          </audio>

          <button type="button" class="btn btn-primary sound mb-2">Liga</button>

          <img
            src="images/cuchi.jpg"
            class="img-fluid"
            alt="O homem mais perfeito do planeta terra"
          />
        </center>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
      crossorigin="anonymous"
    ></script>
    <script type="text/javascript" src="javascript/sound.js"></script>
  </body>
</html>
